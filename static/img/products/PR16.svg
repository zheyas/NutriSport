<text x="300" y="378.4" text-anchor="middle" font-size="32" font-weight="900" fill="#111" font-family="Arial Black, Impact, Helvetica, sans-serif" letter-spacing="0.5">3000</text>
  <text x="300" y="455" text-anchor="middle" font-size="18" font-weight="700" fill="#FF4D6D" font-family="Arial, Helvetica, sans-serif" letter-spacing="2">MASS GAINER</text>

