<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <title>Protein Chips</title>
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#00E5FF" stop-opacity=".45"/>
      <stop offset=".55" stop-color="#2F6BFF" stop-opacity=".12"/>
      <stop offset="1" stop-color="#141414" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2a2a"/><stop offset="1" stop-color="#121212"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2b2b"/><stop offset="1" stop-color="#0e0e0e"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".18" stop-color="#fff" stop-opacity=".16"/>
      <stop offset=".32" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".85" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".35"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2F6BFF"/><stop offset="1" stop-color="#00E5FF"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <rect width="600" height="600" fill="url(#glow)"/>
  <g opacity=".07" stroke="#fff">
    <line x1="0" y1="540" x2="600" y2="540"/><line x1="0" y1="560" x2="600" y2="560"/>
  </g>
  <g transform="translate(300 300) scale(1.12) translate(-300 -300)">

  <ellipse cx="300" cy="505" rx="150" ry="16" fill="#000" opacity=".45"/>
  <path d="M170 120 Q300 140 430 120 L445 300 L430 485 Q300 505 170 485 L155 300 Z" fill="url(#body)"/>
  <path d="M170 120 Q300 140 430 120 L445 300 L430 485 Q300 505 170 485 L155 300 Z" fill="url(#shine)"/>
  <path d="M170 120 Q300 140 430 120 L432 150 Q300 170 168 150 Z" fill="#0d0d0d"/>
  <circle cx="300" cy="330" r="95" fill="url(#band)"/>
  <text x="300" y="205" text-anchor="middle" font-size="24" font-weight="900" fill="#00E5FF" font-family="Arial Black, Impact, Helvetica, sans-serif" letter-spacing="3">NUTRISPORT</text>
  <text x="300" y="315.0" text-anchor="middle" font-size="28" font-weight="900" fill="#111" font-family="Arial Black, Impact, Helvetica, sans-serif" letter-spacing="0.5">PROTEIN</text>
<text x="300" y="345.8" text-anchor="middle" font-size="28" font-weight="900" fill="#111" font-family="Arial Black, Impact, Helvetica, sans-serif" letter-spacing="0.5">CHIPS</text>
  <text x="300" y="460" text-anchor="middle" font-size="17" font-weight="700" fill="#00E5FF" font-family="Arial, Helvetica, sans-serif" letter-spacing="2">HIGH PROTEIN</text>

  </g>
</svg>
