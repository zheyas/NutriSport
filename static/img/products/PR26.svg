<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <title>EAA Complex</title>
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#FFF500" stop-opacity=".45"/>
      <stop offset=".55" stop-color="#FF79FE" stop-opacity=".12"/>
      <stop offset="1" stop-color="#141414" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2a2a"/><stop offset="1" stop-color="#121212"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2b2b"/><stop offset="1" stop-color="#0e0e0e"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".18" stop-color="#fff" stop-opacity=".16"/>
      <stop offset=".32" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".85" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".35"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF79FE"/><stop offset="1" stop-color="#FFF500"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <rect width="600" height="600" fill="url(#glow)"/>
  <g opacity=".07" stroke="#fff">
    <line x1="0" y1="540" x2="600" y2="540"/><line x1="0" y1="560" x2="600" y2="560"/>
  </g>
  <g transform="translate(300 300) scale(1.12) translate(-300 -300)">

  <ellipse cx="300" cy="505" rx="110" ry="15" fill="#000" opacity=".45"/>
  <rect x="200" y="175" width="200" height="325" rx="22" fill="url(#body)"/>
  <rect x="200" y="175" width="200" height="325" rx="22" fill="url(#shine)"/>
  <rect x="212" y="120" width="176" height="70" rx="12" fill="#FFF500"/>
  <rect x="212" y="120" width="176" height="70" rx="12" fill="url(#shine)" opacity=".5"/>
  <g stroke="#000" stroke-opacity=".25" stroke-width="3">
    <line x1="232" y1="128" x2="232" y2="182"/><line x1="262" y1="128" x2="262" y2="182"/>
    <line x1="292" y1="128" x2="292" y2="182"/><line x1="322" y1="128" x2="322" y2="182"/>
    <line x1="352" y1="128" x2="352" y2="182"/>
  </g>
  <rect x="200" y="265" width="200" height="150" fill="url(#band)"/>
  <text x="300" y="240" text-anchor="middle" font-size="18" font-weight="900" fill="#FFF500" font-family="Arial Black, Impact, Helvetica, sans-serif" letter-spacing="3">NUTRISPORT</text>
  <text x="300" y="335.0" text-anchor="middle" font-size="28" font-weight="900" fill="#111" font-family="Arial Black, Impact, Helvetica, sans-serif" letter-spacing="0.5">EAA</text>
<text x="300" y="365.8" text-anchor="middle" font-size="28" font-weight="900" fill="#111" font-family="Arial Black, Impact, Helvetica, sans-serif" letter-spacing="0.5">COMPLEX</text>
  <text x="300" y="455" text-anchor="middle" font-size="16" font-weight="700" fill="#FFF500" font-family="Arial, Helvetica, sans-serif" letter-spacing="2">AMINO ACIDS</text>

  </g>
</svg>
